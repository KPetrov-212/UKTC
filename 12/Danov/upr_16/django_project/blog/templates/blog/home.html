{% extends 'blog/base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
<h2 class="mb-4">Blog Posts</h2>
{% for post in posts %}
    <article class="card mb-4">
        <div class="card-body">
            <h3 class="card-title"><a href="{% url 'post_detail' post.pk %}" class="text-decoration-none">{{ post.title }}</a></h3>
            <p class="card-text text-muted">By {{ post.author }}</p>
            <p class="card-text">{{ post.body|truncatewords:30 }}</p>
        </div>
    </article>
{% empty %}
    <p class="text-muted">No posts yet.</p>
{% endfor %}
{% endblock %}
